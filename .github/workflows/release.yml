name: Build Release APK

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/kado.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kado.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/kado.jks

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -E "^app.version\.(major|minor|patch)" gradle.properties | \
            awk -F= '{print $2}' | paste -sd '.' -)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Kado v${{ steps.version.outputs.version }}
          files: androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Upload APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: kado-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
